[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-transformer-model"
version = "0.1.0"
description = "Point-in-time financial JEPA representations and temporal forecasting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
data = ["duckdb>=1.1", "numpy>=1.26"]
test = ["duckdb>=1.1", "numpy>=1.26"]
triton = ["triton>=3.0; sys_platform == 'linux'"]

[tool.setuptools.packages.find]
where = ["src"]
